format: kairos-workshop/v0
id: sections-text-only
title: "Stage 9: Sections without steps"
goal: read the sections
sections:
  - title: Just text
    text: |
      First paragraph.

      Second paragraph with a [link](stage:sections-text-only#just-text).
    warnings:
      - kind: note
        text: A note.
      - kind: tip
        text: A tip is shown as a note.
  - title: Only a warning
    when: { os: windows }
    warnings:
      - kind: important
        text: Important becomes a warning.
