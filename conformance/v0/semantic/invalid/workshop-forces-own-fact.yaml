# expect-error: an option forces the fact of its own question
format: kairos-workshop/v0
id: bad
title: Bad
repository: kairos-io/bad
loadout:
  questions:
    - fact: os
      title: What is your computer running?
      options:
        - { value: linux, label: Linux }
        - { value: macos, label: macOS }
        - { value: windows, label: Windows, forces: { os: linux } }
stages:
  - { id: s, title: S, markdown: s.md }
