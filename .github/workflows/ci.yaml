name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate workshop content against the schema
        run: npm run validate
      - name: Unit, schema and conformance tests
        run: npm test
      - name: Generated markdown is up to date
        run: npm run publish:md -- --check

  lint:
    uses: kairos-io/linting-composite-action/.github/workflows/reusable-linting.yaml@972437ebe252f9cb30f19dba30727080d1bddea7  # main on 2026-08-26
    with:
      is-go: false
      yamldirs: "stages conformance .github"
