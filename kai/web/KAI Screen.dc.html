<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="kai-engine.js"></script>
<style>body{margin:0;}a{color:inherit;}a:hover{color:inherit;}</style>
</helmet>

    <div style="position:absolute;left:0;top:0;width:160px;height:144px;transform:scale({{ scale }});transform-origin:0 0;font-family:'Press Start 2P',monospace;font-size:8px;line-height:8px;white-space:pre;{{ cssVars }}">
      <canvas ref="{{ canvasRef }}" width="160" height="144" aria-hidden="true" style="position:absolute;left:0;top:0;width:160px;height:144px;image-rendering:pixelated;"></canvas>
      <sc-for list="{{ texts }}" as="t" hint-placeholder-count="0">
        <div style="position:absolute;left:{{ t.x }}px;top:{{ t.y }}px;width:{{ t.w }}px;text-align:{{ t.align }};font-size:{{ t.fs }}px;line-height:{{ t.fs }}px;color:{{ t.c }};">{{ t.s }}</div>
      </sc-for>
      <sc-for list="{{ buttons }}" as="b" hint-placeholder-count="0">
        <button onClick="{{ b.on }}" disabled="{{ b.disabled }}" aria-label="{{ b.aria }}" style="position:absolute;left:{{ b.x }}px;top:{{ b.y }}px;width:{{ b.w }}px;height:{{ b.h }}px;padding:0;margin:0;border:0;background:transparent;cursor:pointer;font:inherit;color:transparent;"></button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

      tx(0, 10, 'XP' + String((P.hud && P.hud.xp) || 0).padStart(4, '0'), { w: 156, align: 'right' });
      const [ox, oy] = this.mapOrigin();
      this.stops().forEach(([a, b], i) => { const nx = a - ox, ny = b - oy + 19; if (ny >= 19 && ny < 96 && nx > -8 && nx < 168) B.push({ x: nx - 7, y: ny - 7, w: 14, h: 14, aria: 'Stop ' + (i + 1), disabled: false, on: e => { e.stopPropagation(); P.onMap && P.onMap(i); } }); });
    } else if (s === 'title') {
      center(40, W.game.title, { fs: 16 }); center(60, W.game.edition);
      (P.menu || M.title_menu.map(l => ({ label: l }))).forEach((it, i) => {
        tx(40, 101 + i * 12, it.disabled ? '(' + it.label + ')' : it.label);
        B.push({ x: 24, y: 98 + i * 12, w: 112, h: 12, aria: it.label, disabled: !!it.disabled, on: e => { e.stopPropagation(); P.onMenu && P.onMenu(i); } });
      });
    } else if (s === 'name') {
      center(8, M.name_prompt);
      tx(20, 30, String(P.nameText || '').toUpperCase().slice(0, 12));
    } else if (s === 'character') {
      center(6, M.character_prompt);
      W.player.characters.forEach((ch, i) => {
        center(80, i === (P.cursor ?? 0) ? '[' + ch.label.toUpperCase() + ']' : ch.label.toUpperCase(), { x: 2 + i * 52, w: 52 });
        B.push({ x: 6 + i * 52, y: 16, w: 44, h: 72, aria: ch.label, disabled: false, on: e => { e.stopPropagation(); P.onMenu && P.onMenu(i); } });
      });
    } else if (s === 'loadout') {
      tx(8, 6, 'LOADOUT');
      (P.loadout || []).forEach((r, i) => {
        const y = 20 + i * 18, sel = i === (P.cursor ?? 0), col = sel ? 'var(--c0)' : 'var(--c3)';
        tx(20, y + 5, (M.loadout_labels[r.fact] || r.fact).padEnd(4), { c: col });
        tx(64, y + 5, String(r.value).toUpperCase().slice(0, 11), { c: col });
        B.push({ x: 4, y, w: 152, h: 17, aria: r.fact, disabled: false, on: e => { e.stopPropagation(); P.onMenu && P.onMenu(i); } });
      });
    } else if (s === 'mentor') {
      const mm = P.mentor || {}, parts = String(mm.name || '').toUpperCase().split(' ');
      tx(64, 14, 'MENTOR');
      tx(64, 26, (parts[0] || '').slice(0, 11));
      if (parts.length > 1) tx(64, 36, parts.slice(1).join(' ').slice(0, 11));
      tx(64, 50, String(mm.country || '').toUpperCase().slice(0, 11));
    } else if (s === 'clear' || s === 'fail' || s === 'complete') {
      const kind = P.kind || 'step';
      if (P.headline) center(8, P.headline);
      if (kind === 'item' && s === 'clear') (P.items || []).slice(0, 3).forEach((it, i, arr) => { const sx = Math.floor((160 - arr.length * 48) / 2); center(60, it.sub || '', { x: sx + i * 48, w: 48 }); });
      else if (P.sub) center(s === 'complete' ? 66 : 68, P.sub);
    }
    return { T, B };
  }

  renderVals() {
    const E = window.KAIE, ready = this.state.ready && E.ready();
    const scale = this.scaleVal();
    const base = {
      scale, outerW: 160 * scale, outerH: 144 * scale,
      wrapRef: el => { if (el && el !== this.wrap) { this.wrap = el; if (this.ro) this.ro.observe(el); } },
      canvasRef: el => { this.canvas = el; if (el) this.draw(); },
      advance: () => this.advance()
    };
    if (!ready) return { ...base, cssVars: '', texts: [], buttons: [], ariaLabel: 'Game screen' };
    const U = E.pal(this.mode(), 'ui');
    const { T, B } = this.layout();
    return {
      ...base,
      cssVars: `--c0:${U[0]};--c1:${U[1]};--c2:${U[2]};--c3:${U[3]};`,
      texts: T, buttons: B,
      ariaLabel: 'Game screen: ' + (this.props.dialog || this.screen())
    };
  }
}
</script>
</body>
</html>
